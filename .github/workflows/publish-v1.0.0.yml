name: Publish SyntFER v1.0.0 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release content
        uses: actions/checkout@v4
      - name: Publish v1.0.0 if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v1.0.0 already exists; not publishing a duplicate."
            exit 0
          fi
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SyntFER v1.0.0 — Initial Research Code Release" \
            --notes-file RELEASE_NOTES.md \
            --latest
